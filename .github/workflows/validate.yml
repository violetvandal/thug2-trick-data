name: validate

# Every correction touches data/thug2-tricks.json, so check the file still holds
# together before a human reads the change.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the dataset is internally consistent
        run: python3 validate.py
